<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { margin: 0; padding: 0; background: transparent; color: #f8fafc; }
    .sat-shell {
        background: linear-gradient(160deg, #071324 0%, #0d213a 100%);
        border: 1.5px solid rgba(56, 189, 248, 0.45);
        border-radius: 14px;
        padding: 10px;
        box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    }
    .toolbar {
        display: flex; flex-wrap: wrap; gap: 5px; padding: 7px 8px;
        background: rgba(15, 35, 62, 0.9);
        border: 1px solid rgba(56, 189, 248, 0.3);
        border-radius: 10px; margin-bottom: 8px;
        align-items: center; justify-content: space-between;
    }
    .tool-btn {
        background: rgba(18, 48, 86, 0.95); color: #fff;
        border: 1px solid rgba(56, 189, 248, 0.42);
        border-radius: 7px; padding: 5px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .tool-btn.active { background: linear-gradient(135deg, #0284c7, #00e5ff); color: #031221; border-color: #fff; }
    .tool-btn.commit {
        background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        color: #fff; border: 1.5px solid #a7f3d0;
        padding: 6px 13px; font-size: 12.5px; font-weight: 900;
        box-shadow: 0 0 12px rgba(16, 185, 129, 0.45);
    }
    .coord-row {
        display: flex; gap: 6px; align-items: center; justify-content: space-between;
        margin-bottom: 8px; flex-wrap: wrap;
    }
    .coord-in {
        flex: 1; min-width: 180px; background: #061224; color: #fff;
        border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 7px;
        padding: 6px 10px; font-size: 12.5px; direction: ltr; text-align: left;
    }
    #mapWrap {
        position: relative; width: 100%; aspect-ratio: 960 / 500;
        border-radius: 10px; overflow: hidden; border: 2px solid #38bdf8; background: #0f172a;
    }
    #satMap { width: 100%; height: 100%; background: transparent; }
    #drawCanvas {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        z-index: 450; pointer-events: none; background: transparent;
        touch-action: none; -ms-touch-action: none;
    }
    #drawCanvas.drawing { touch-action: none; pointer-events: auto; }
    .leaflet-container { background: #0f172a; }
    .status-bar {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 7px; font-size: 11.5px; color: #bae6fd; gap: 8px; flex-wrap: wrap;
    }
    #coordFeedback {
        width: 100%; min-height: 18px; font-size: 12px; font-weight: 800;
        color: #7dd3fc; margin: -2px 0 6px;
    }
    #coordFeedback.error { color: #fca5a5; }
    #coordFeedback.ok { color: #86efac; }
</style>
</head>
<body>
<div class="sat-shell" id="satShell">
    <div class="toolbar">
        <div style="display:flex; gap:5px; flex-wrap:wrap;">
            <button class="tool-btn active" id="btnPan" type="button">🖐️ تحريك وتكبير</button>
            <button class="tool-btn" id="btnV1" type="button">🔴 مسار (1)</button>
            <button class="tool-btn" id="btnV2" type="button">🔵 مسار (2)</button>
            <button class="tool-btn" id="btnImp" type="button">💥 نقطة الاصطدام</button>
            <button class="tool-btn" id="btnClear" type="button">🗑️ مسح الرسم</button>
        </div>
        <button class="tool-btn commit" id="btnCommit" type="button">✅ اعتماد التصوير الجوي في التقرير</button>
    </div>
    <div class="coord-row">
        <input class="coord-in" id="coordBox" value="" placeholder="17.0369, 43.0983"/>
        <button class="tool-btn" id="btnJumpCoords" type="button">📍 انتقال للإحداثيات</button>
        <button class="tool-btn" id="btnClearPin" type="button">📌 إزالة الدبوس</button>
        <button class="tool-btn" id="btnProvider" type="button">🛰️ القمر: Google HD</button>
        <button class="tool-btn" id="btnLabels" type="button">🏷️ إظهار/إخفاء المسميات</button>
    </div>
    <div id="coordFeedback"></div>
    <div id="mapWrap">
        <div id="satMap"></div>
        <canvas id="drawCanvas"></canvas>
    </div>
    <div class="status-bar">
        <span>🛰️ حدّد الموقع وارسم المسارات إن رغبت، ثم اضغط <b>«اعتماد التصوير الجوي في التقرير»</b> لإدراجه في ورقة A4.</span>
        <span id="satSaveStatus" style="color:#7dd3fc;font-weight:800;">● جاهز للالتقاط</span>
    </div>
</div>
<script>
function sendToStreamlit(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
}
const TOUCH_HIT = 24;
function idbOpen() {
    return new Promise(function(resolve, reject) {
        try {
            var req = indexedDB.open("BayyinahPersistDB", 1);
            req.onupgradeneeded = function() {
                var db = req.result;
                if (!db.objectStoreNames.contains("sketch")) db.createObjectStore("sketch");
            };
            req.onsuccess = function() { resolve(req.result); };
            req.onerror = function() { reject(req.error); };
        } catch (err) { reject(err); }
    });
}
function idbPut(key, value) {
    return idbOpen().then(function(db) {
        return new Promise(function(resolve, reject) {
            try {
                var tx = db.transaction("sketch", "readwrite");
                tx.objectStore("sketch").put(value, key);
                tx.oncomplete = function() { resolve(true); };
                tx.onerror = function() { reject(tx.error); };
            } catch (err) { reject(err); }
        });
    }).catch(function() { return false; });
}
function idbGet(key) {
    return idbOpen().then(function(db) {
        return new Promise(function(resolve, reject) {
            try {
                var tx = db.transaction("sketch", "readonly");
                var req = tx.objectStore("sketch").get(key);
                req.onsuccess = function() { resolve(req.result || null); };
                req.onerror = function() { reject(req.error); };
            } catch (err) { reject(err); }
        });
    }).catch(function() { return null; });
}
function captureAerialState() {
    var c = map.getCenter();
    return {
        kind: "aerial",
        updatedAt: Date.now(),
        center: [c.lat, c.lng],
        lat: c.lat,
        lng: c.lng,
        zoom: map.getZoom(),
        shapes: shapes,
        provider: currentProvider,
        labelsVisible: labelsVisible
    };
}
function persistAerialEditor() {
    var state = captureAerialState();
    try {
        var parentWin = window.parent || window;
        parentWin.__BAYYINAH_SKETCH_STATE__ = parentWin.__BAYYINAH_SKETCH_STATE__ || {};
        parentWin.__BAYYINAH_SKETCH_STATE__.aerial = state;
        parentWin.__BAYYINAH_SKETCH_STATE__.updatedAt = Date.now();
        parentWin.localStorage.setItem("bayyinah_aerial_editor", JSON.stringify(state));
    } catch (err) {}
    idbPut("aerial", state);
}
function applyAerialState(saved) {
    if (!saved || typeof saved !== "object") return false;
    var center = saved.center;
    if ((!center || !center.length) && saved.lat != null && saved.lng != null) {
        center = [saved.lat, saved.lng];
    }
    if (saved.provider === "esri" || saved.provider === "google") currentProvider = saved.provider;
    if (typeof saved.labelsVisible === "boolean") labelsVisible = saved.labelsVisible;
    refreshMapLayers();
    if (center && center.length >= 2) {
        map.invalidateSize();
        map.setView(center, saved.zoom || 18);
        map.invalidateSize();
    }
    shapes = Array.isArray(saved.shapes) ? JSON.parse(JSON.stringify(saved.shapes)) : shapes;
    setTimeout(redraw, 120);
    return true;
}
if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
        const radius = Math.max(0, Math.min(r || 0, w / 2, h / 2));
        this.moveTo(x + radius, y);
        this.arcTo(x + w, y, x + w, y + h, radius);
        this.arcTo(x + w, y + h, x, y + h, radius);
        this.arcTo(x, y + h, x, y, radius);
        this.arcTo(x, y, x + w, y, radius);
        this.closePath();
        return this;
    };
}

const DEFAULT_COORDS = [17.0369, 43.0983];
const map = L.map("satMap", {
    zoomControl: true,
    maxZoom: 22,
    minZoom: 5,
    preferCanvas: true
}).setView(DEFAULT_COORDS, 18);

const googleTileOpts = {
    subdomains: ["mt0", "mt1", "mt2", "mt3"],
    maxNativeZoom: 20,
    maxZoom: 22,
    crossOrigin: "anonymous",
    updateWhenIdle: false,
    updateWhenZooming: true,
    keepBuffer: 2
};
const googleSatLayer = L.tileLayer(
    "https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}",
    Object.assign({}, googleTileOpts)
);
const googleHybridArLayer = L.tileLayer(
    "https://{s}.google.com/vt/lyrs=y&hl=ar&x={x}&y={y}&z={z}",
    Object.assign({}, googleTileOpts)
);
const esriSatLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
    { maxNativeZoom: 17, maxZoom: 22, crossOrigin: "anonymous" }
);
const esriLabelsLayer = L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
    { maxNativeZoom: 17, maxZoom: 22, crossOrigin: "anonymous" }
);

[googleSatLayer, googleHybridArLayer, esriSatLayer, esriLabelsLayer].forEach(function(layer) {
    const originalCreateTile = layer.createTile.bind(layer);
    layer.createTile = function(coords, done) {
        const tile = originalCreateTile(coords, done);
        try {
            if (tile && tile.tagName === "IMG") {
                tile.crossOrigin = "anonymous";
                tile.setAttribute("crossOrigin", "anonymous");
            }
        } catch (errTile) {}
        return tile;
    };
});

let currentProvider = "google";
let labelsVisible = true;
let jumpMarker = null;

function refreshMapLayers() {
    [googleSatLayer, googleHybridArLayer, esriSatLayer, esriLabelsLayer].forEach(l => {
        if (map.hasLayer(l)) map.removeLayer(l);
    });
    if (currentProvider === "google") {
        if (labelsVisible) googleHybridArLayer.addTo(map);
        else googleSatLayer.addTo(map);
    } else {
        esriSatLayer.addTo(map);
        if (labelsVisible) esriLabelsLayer.addTo(map);
    }
    const srcBtn = document.getElementById("btnProvider");
    if (srcBtn) {
        srcBtn.textContent = currentProvider === "google" ? "🛰️ القمر: Google HD" : "🌍 القمر: Esri";
    }
    setTimeout(() => map.invalidateSize(), 50);
}

function toggleLabels() {
    labelsVisible = !labelsVisible;
    refreshMapLayers();
}
function switchSatelliteProvider() {
    currentProvider = (currentProvider === "google") ? "esri" : "google";
    refreshMapLayers();
}

refreshMapLayers();

const canvas = document.getElementById("drawCanvas");
const ctx = canvas.getContext("2d", { alpha: true });
let mode = "pan";
let shapes = [];
let startPt = null;
let initialized = false;
let suppressCoordOverwrite = false;

function setCoordFeedback(msg, kind) {
    const el = document.getElementById("coordFeedback");
    if (!el) return;
    el.textContent = msg || "";
    el.className = kind || "";
}

function resizeCanvas() {
    const wrap = document.getElementById("mapWrap");
    if (!wrap) return;
    const rect = wrap.getBoundingClientRect();
    if (rect.width > 0 && rect.height > 0) {
        canvas.width = Math.max(1, Math.round(rect.width));
        canvas.height = Math.max(1, Math.round(rect.height));
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        map.invalidateSize();
        redraw();
    }
}
function syncHeight() {
    const sh = document.getElementById("satShell");
    if (sh) sendToStreamlit("streamlit:setFrameHeight", { height: Math.ceil(sh.getBoundingClientRect().height) + 24 });
}
if (typeof ResizeObserver !== "undefined") {
    new ResizeObserver(() => { resizeCanvas(); syncHeight(); }).observe(document.body);
}
window.addEventListener("load", () => {
    setTimeout(() => {
        map.invalidateSize();
        resizeCanvas();
        syncHeight();
    }, 300);
});

function setMode(m) {
    mode = m;
    document.querySelectorAll(".tool-btn").forEach(b => b.classList.remove("active"));
    const ids = { pan: "btnPan", v1: "btnV1", v2: "btnV2", impact: "btnImp" };
    if (ids[m]) document.getElementById(ids[m]).classList.add("active");
    canvas.style.pointerEvents = (m === "pan") ? "none" : "auto";
    if (m === "pan") canvas.classList.remove("drawing");
    else canvas.classList.add("drawing");
}

function arabicDigitsToLatin(str) {
    const mapDigits = {
        "٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9",
        "۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"
    };
    return String(str || "").replace(/[٠-٩۰-۹]/g, ch => mapDigits[ch] || ch);
}

function normalizeCoordText(raw) {
    let s = arabicDigitsToLatin(raw || "");
    s = s.replace(/[\u200e\u200f\u202a-\u202e\u2066-\u2069]/g, "");
    s = s.replace(/،/g, ",").replace(/؛/g, ";");
    s = s.replace(/\u00a0/g, " ").trim();
    return s;
}

function dmsToDecimal(deg, minutes, seconds, hemi) {
    let val = Math.abs(Number(deg) || 0) + (Number(minutes) || 0) / 60 + (Number(seconds) || 0) / 3600;
    const h = String(hemi || "").toUpperCase();
    if (h === "S" || h === "W" || h === "ج" || h === "ق") val = -val;
    return val;
}

function parseDmsPair(text) {
    const re = /(-?\d+(?:\.\d+)?)\s*[°º]?\s*(\d+(?:\.\d+)?)?\s*['′]?\s*(\d+(?:\.\d+)?)?\s*["″]?\s*([NSnsEWewشمالجق])?/g;
    const found = [];
    let m;
    while ((m = re.exec(text)) !== null) {
        if (m[1] == null) continue;
        found.push(dmsToDecimal(m[1], m[2], m[3], m[4]));
        if (found.length >= 2) break;
    }
    return found.length >= 2 ? found : null;
}

function extractFromGoogleUrl(text) {
    const at = text.match(/@(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
    if (at) return [Number(at[1]), Number(at[2])];
    const q = text.match(/[?&]q=(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);
    if (q) return [Number(q[1]), Number(q[2])];
    const ll = text.match(/[?&]ll=(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/i);
    if (ll) return [Number(ll[1]), Number(ll[2])];
    const dest = text.match(/destination=(-?\d+(?:\.\d+)?)%2C(-?\d+(?:\.\d+)?)/i)
        || text.match(/destination=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/i);
    if (dest) return [Number(dest[1]), Number(dest[2])];
    return null;
}

function maybeSwapSaudiOrder(a, b) {
    let lat = a, lng = b;
    const looksLngFirst = (a >= 34 && a <= 56) && (b >= 15 && b <= 33);
    const looksLatFirst = (a >= 15 && a <= 33) && (b >= 34 && b <= 56);
    if (looksLngFirst && !looksLatFirst) {
        lat = b;
        lng = a;
    }
    return [lat, lng];
}

function parseSmartCoordinates(rawInput) {
    const normalized = normalizeCoordText(rawInput);
    if (!normalized) return null;

    const fromUrl = extractFromGoogleUrl(normalized);
    if (fromUrl) {
        const swapped = maybeSwapSaudiOrder(fromUrl[0], fromUrl[1]);
        if (Math.abs(swapped[0]) <= 90 && Math.abs(swapped[1]) <= 180) return swapped;
    }

    if (/[°º'′"″]/.test(normalized) || /[NSnsEWewشمالجق]/.test(normalized)) {
        const dms = parseDmsPair(normalized);
        if (dms) {
            const swapped = maybeSwapSaudiOrder(dms[0], dms[1]);
            if (Math.abs(swapped[0]) <= 90 && Math.abs(swapped[1]) <= 180) return swapped;
        }
    }

    const nums = normalized
        .replace(/[^\d\.\-\s,;/]/g, " ")
        .split(/[\s,;/]+/)
        .map(Number)
        .filter(n => Number.isFinite(n));
    if (nums.length >= 2) {
        const swapped = maybeSwapSaudiOrder(nums[0], nums[1]);
        if (Math.abs(swapped[0]) <= 90 && Math.abs(swapped[1]) <= 180) return swapped;
    }
    return null;
}

function placeJumpMarker(lat, lng) {
    if (jumpMarker) {
        map.removeLayer(jumpMarker);
        jumpMarker = null;
    }
    jumpMarker = L.marker([lat, lng], { title: "موقع الإحداثيات" }).addTo(map);
    jumpMarker.bindPopup("📍 " + lat.toFixed(5) + ", " + lng.toFixed(5)).openPopup();
}

function clearJumpMarker() {
    if (jumpMarker) {
        map.removeLayer(jumpMarker);
        jumpMarker = null;
    }
    setCoordFeedback("تمت إزالة دبوس الإحداثيات.", "ok");
}

function jumpToCoords() {
    const box = document.getElementById("coordBox");
    if (!box) return;
    let raw = (box.value || "").trim();
    if (!raw) raw = (box.placeholder || "").trim() || (DEFAULT_COORDS[0] + ", " + DEFAULT_COORDS[1]);
    const parsed = parseSmartCoordinates(raw);
    if (!parsed) {
        setCoordFeedback("⚠️ تعذّر قراءة الإحداثيات. جرّب صيغة مثل 17.0369, 43.0983 أو رابط خرائط Google أو DMS.", "error");
        return;
    }
    const [lat, lng] = parsed;
    suppressCoordOverwrite = true;
    map.invalidateSize();
    map.setView([lat, lng], 19);
    map.invalidateSize();
    placeJumpMarker(lat, lng);
    box.value = lat.toFixed(5) + ", " + lng.toFixed(5);
    setCoordFeedback("✅ تم الانتقال إلى: " + lat.toFixed(5) + ", " + lng.toFixed(5), "ok");
    setTimeout(() => {
        map.invalidateSize();
        suppressCoordOverwrite = false;
    }, 350);
}

map.on("moveend", () => {
    if (suppressCoordOverwrite) return;
    const c = map.getCenter();
    const box = document.getElementById("coordBox");
    if (box) box.value = c.lat.toFixed(5) + ", " + c.lng.toFixed(5);
    persistAerialEditor();
});

function clearDrawings() { shapes = []; redraw(); persistAerialEditor(); }

function drawArrowOnCtx(targetCtx, x1, y1, x2, y2, color, label, scale) {
    const head = 15 * scale;
    const angle = Math.atan2(y2 - y1, x2 - x1);
    targetCtx.save();
    targetCtx.strokeStyle = color; targetCtx.fillStyle = color; targetCtx.lineWidth = 4 * scale;
    targetCtx.beginPath(); targetCtx.moveTo(x1, y1); targetCtx.lineTo(x2, y2); targetCtx.stroke();
    targetCtx.beginPath();
    targetCtx.moveTo(x2, y2);
    targetCtx.lineTo(x2 - head * Math.cos(angle - Math.PI / 6), y2 - head * Math.sin(angle - Math.PI / 6));
    targetCtx.lineTo(x2 - head * Math.cos(angle + Math.PI / 6), y2 - head * Math.sin(angle + Math.PI / 6));
    targetCtx.closePath(); targetCtx.fill();
    targetCtx.beginPath(); targetCtx.arc(x1, y1, 12 * scale, 0, Math.PI * 2);
    targetCtx.fillStyle = "#ffffff"; targetCtx.fill(); targetCtx.lineWidth = 2.5 * scale; targetCtx.stroke();
    targetCtx.fillStyle = color; targetCtx.font = "900 " + Math.round(13 * scale) + "px Tahoma, Arial";
    targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
    targetCtx.fillText(label, x1, y1);
    targetCtx.restore();
}
function renderShapesToCtx(targetCtx, sx, sy) {
    const sc = (sx + sy) / 2;
    shapes.forEach(s => {
        if (s.type === "v1") drawArrowOnCtx(targetCtx, s.x1 * sx, s.y1 * sy, s.x2 * sx, s.y2 * sy, "#ef4444", "1", sc);
        else if (s.type === "v2") drawArrowOnCtx(targetCtx, s.x1 * sx, s.y1 * sy, s.x2 * sx, s.y2 * sy, "#3b82f6", "2", sc);
        else if (s.type === "impact") {
            targetCtx.save();
            targetCtx.beginPath(); targetCtx.arc(s.x * sx, s.y * sy, 16 * sc, 0, Math.PI * 2);
            targetCtx.fillStyle = "rgba(250, 204, 21, 0.92)"; targetCtx.fill();
            targetCtx.lineWidth = 3 * sc; targetCtx.strokeStyle = "#dc2626"; targetCtx.stroke();
            targetCtx.fillStyle = "#991b1b"; targetCtx.font = "900 " + Math.round(15 * sc) + "px Arial";
            targetCtx.textAlign = "center"; targetCtx.textBaseline = "middle";
            targetCtx.fillText("X", s.x * sx, s.y * sy);
            targetCtx.restore();
        }
    });
}
function redraw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    renderShapesToCtx(ctx, 1, 1);
}
function eventClientPoint(evt) {
    if (evt.touches && evt.touches.length) return evt.touches[0];
    if (evt.changedTouches && evt.changedTouches.length) return evt.changedTouches[0];
    return evt;
}
function getCanvasPos(evt) {
    const t = eventClientPoint(evt);
    const r = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (r.width || 1);
    const scaleY = canvas.height / (r.height || 1);
    return {
        x: (t.clientX - r.left) * scaleX,
        y: (t.clientY - r.top) * scaleY
    };
}
function beginDraw(e) {
    if (mode === "pan") return false;
    const p = getCanvasPos(e);
    if (mode === "impact") {
        shapes.push({ type: "impact", x: p.x, y: p.y });
        redraw();
        persistAerialEditor();
        if (e.cancelable) e.preventDefault();
        return true;
    }
    startPt = { x: p.x, y: p.y };
    canvas.classList.add("drawing");
    canvas.style.touchAction = "none";
    if (e.cancelable) e.preventDefault();
    return true;
}
function moveDraw(e) {
    if (!startPt || mode === "pan" || mode === "impact") return false;
    if (e.cancelable) e.preventDefault();
    return true;
}
function endDraw(e) {
    if (!startPt) return false;
    const p = getCanvasPos(e);
    if (Math.hypot(p.x - startPt.x, p.y - startPt.y) > Math.max(10, TOUCH_HIT / 2)) {
        shapes.push({ type: mode, x1: startPt.x, y1: startPt.y, x2: p.x, y2: p.y });
    }
    startPt = null;
    redraw();
    persistAerialEditor();
    if (mode === "pan") canvas.classList.remove("drawing");
    if (e && e.cancelable) e.preventDefault();
    return true;
}
canvas.addEventListener("mousedown", e => { beginDraw(e); });
canvas.addEventListener("mousemove", e => { moveDraw(e); });
canvas.addEventListener("mouseup", e => { endDraw(e); });
canvas.addEventListener("mouseleave", e => { if (startPt) endDraw(e); });
canvas.addEventListener("touchstart", e => { beginDraw(e); }, { passive: false });
canvas.addEventListener("touchmove", e => { moveDraw(e); }, { passive: false });
canvas.addEventListener("touchend", e => { endDraw(e); }, { passive: false });
canvas.addEventListener("touchcancel", e => { endDraw(e); }, { passive: false });

function commitSatelliteToStreamlit() {
    const stEl = document.getElementById("satSaveStatus");
    stEl.textContent = "⏳ جارٍ التقاط واعتماد الموقع الجوي...";
    stEl.style.color = "#fbbf24";
    map.invalidateSize();
    const expCanvas = document.createElement("canvas");
    expCanvas.width = 960;
    expCanvas.height = 520;
    const expCtx = expCanvas.getContext("2d");
    expCtx.fillStyle = "#0f172a";
    expCtx.fillRect(0, 0, 960, 520);
    const wrapRect = document.getElementById("mapWrap").getBoundingClientRect();
    const sx = 960 / (wrapRect.width || 960);
    const sy = 520 / (wrapRect.height || 520);
    const tiles = document.querySelectorAll("#satMap img.leaflet-tile.leaflet-tile-loaded");
    tiles.forEach(img => {
        try {
            if (img.getAttribute("crossorigin") !== "anonymous") {
                img.setAttribute("crossOrigin", "anonymous");
            }
        } catch (errAttr) {}
        const parentOpacity = parseFloat(window.getComputedStyle(img.parentElement).opacity || "1");
        if (img.complete && img.naturalWidth > 0 && parentOpacity > 0) {
            const tr = img.getBoundingClientRect();
            const dx = (tr.left - wrapRect.left) * sx;
            const dy = (tr.top - wrapRect.top) * sy;
            const dw = tr.width * sx;
            const dh = tr.height * sy;
            try { expCtx.drawImage(img, dx, dy, dw, dh); } catch (err) {}
        }
    });
    renderShapesToCtx(expCtx, sx, sy);
    expCtx.save();
    expCtx.translate(895, 52);
    expCtx.fillStyle = "rgba(255,255,255,0.95)"; expCtx.strokeStyle = "#0f172a"; expCtx.lineWidth = 2;
    expCtx.beginPath(); expCtx.arc(0, 0, 26, 0, Math.PI * 2); expCtx.fill(); expCtx.stroke();
    expCtx.fillStyle = "#dc2626";
    expCtx.beginPath(); expCtx.moveTo(0, -18); expCtx.lineTo(-6, 4); expCtx.lineTo(0, 0); expCtx.lineTo(6, 4); expCtx.closePath(); expCtx.fill();
    expCtx.fillStyle = "#0f172a"; expCtx.font = "900 10.5px Tahoma"; expCtx.textAlign = "center";
    expCtx.fillText("شمال N", 0, 16);
    expCtx.restore();
    const c = map.getCenter();
    const coordTxt = c.lat.toFixed(5) + "° N , " + c.lng.toFixed(5) + "° E";
    expCtx.save();
    expCtx.fillStyle = "rgba(255, 255, 255, 0.95)";
    expCtx.strokeStyle = "#0f172a"; expCtx.lineWidth = 1.8;
    expCtx.beginPath(); expCtx.roundRect(14, 468, 932, 40, 6); expCtx.fill(); expCtx.stroke();
    expCtx.fillStyle = "#0f172a"; expCtx.font = "bold 13.5px Tahoma, Arial";
    expCtx.textAlign = "right";
    expCtx.fillText("التوثيق الجوي الفضائي لموقع الحادث", 930, 493);
    expCtx.fillStyle = "#0369a1"; expCtx.font = "bold 13px Arial";
    expCtx.textAlign = "left";
    expCtx.fillText("GPS: " + coordTxt, 30, 493);
    expCtx.restore();
    let jpgDataUrl = "";
    try {
        jpgDataUrl = expCanvas.toDataURL("image/jpeg", 0.85);
    } catch (errExport) {
        stEl.textContent = "⚠️ تعذر تصدير اللقطة (CORS). جرّب مزوّد Esri أو أعد تحميل البلاطات.";
        stEl.style.color = "#f87171";
        return;
    }
    stEl.textContent = "✅ معتمد في ورقة التقرير A4";
    stEl.style.color = "#34d399";
    persistAerialEditor();
    sendToStreamlit("streamlit:setComponentValue", {
        value: {
            image: jpgDataUrl,
            coords: coordTxt,
            aerial_sketch_data_url: jpgDataUrl,
            satellite_img_b64: jpgDataUrl,
            state: captureAerialState(),
            ts: Date.now()
        }
    });
}

window.addEventListener("message", function(event) {
    if (!event.data || event.data.type !== "streamlit:render") return;
    const args = event.data.args || {};
    if (!initialized) {
        initialized = true;
        let restored = false;
        const candidates = [];
        const saved = args.saved_sat_state || {};
        if (saved && (saved.center || (saved.lat != null && saved.lng != null) || (saved.shapes && saved.shapes.length))) {
            candidates.push(saved);
        }
        try {
            var parentWin = window.parent || window;
            var mem = parentWin.__BAYYINAH_SKETCH_STATE__ && parentWin.__BAYYINAH_SKETCH_STATE__.aerial;
            if (mem) candidates.push(mem);
            var ls = parentWin.localStorage.getItem("bayyinah_aerial_editor");
            if (ls) candidates.push(JSON.parse(ls));
        } catch (errMem) {}
        if (candidates.length) {
            candidates.sort(function(a, b) {
                return Number(b.updatedAt || 0) - Number(a.updatedAt || 0);
            });
            restored = applyAerialState(candidates[0]);
        }
        if (!restored) {
            idbGet("aerial").then(function(stored) {
                if (stored) applyAerialState(stored);
                persistAerialEditor();
            });
        } else {
            persistAerialEditor();
        }
        setTimeout(() => {
            map.invalidateSize();
            resizeCanvas();
            syncHeight();
        }, 300);
        syncHeight();
    }
});

document.getElementById("btnPan").addEventListener("click", () => setMode("pan"));
document.getElementById("btnV1").addEventListener("click", () => setMode("v1"));
document.getElementById("btnV2").addEventListener("click", () => setMode("v2"));
document.getElementById("btnImp").addEventListener("click", () => setMode("impact"));
document.getElementById("btnClear").addEventListener("click", clearDrawings);
document.getElementById("btnCommit").addEventListener("click", commitSatelliteToStreamlit);
document.getElementById("btnJumpCoords").addEventListener("click", jumpToCoords);
document.getElementById("btnClearPin").addEventListener("click", clearJumpMarker);
document.getElementById("btnProvider").addEventListener("click", switchSatelliteProvider);
document.getElementById("btnLabels").addEventListener("click", toggleLabels);
document.getElementById("coordBox").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        e.preventDefault();
        jumpToCoords();
    }
});

window.setMode = setMode;
window.jumpToCoords = jumpToCoords;
window.clearDrawings = clearDrawings;
window.clearJumpMarker = clearJumpMarker;
window.toggleLabels = toggleLabels;
window.switchSatelliteProvider = switchSatelliteProvider;
window.commitSatelliteToStreamlit = commitSatelliteToStreamlit;

sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
setTimeout(() => {
    map.invalidateSize();
    resizeCanvas();
    syncHeight();
}, 300);
syncHeight();
</script>
