    <!DOCTYPE html>
    <html dir="rtl" lang="ar">
    <head>
    <meta charset="utf-8"/>
    <style>
        * { box-sizing: border-box; user-select: none; font-family: 'Segoe UI', Tahoma, Arial, sans-serif; }
        body { margin: 0; padding: 0; background: transparent; color: #f8fafc; }
        .studio-shell {
            background: linear-gradient(160deg, #071324 0%, #0d213a 100%);
            border: 1.5px solid rgba(56, 189, 248, 0.45);
            border-radius: 14px;
            padding: 12px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.5);
        }
        .controls-grid {
            display: grid;
            grid-template-columns: 1.4fr 1.1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .ctrl-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #7dd3fc;
            margin-bottom: 4px;
        }
        select, input[type="text"] {
            width: 100%;
            background: #061224;
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.45);
            border-radius: 8px;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 700;
            outline: none;
        }
        select:focus, input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56,189,248,0.3); }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            padding: 7px 9px;
            background: rgba(15, 35, 62, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.25);
            border-radius: 10px;
        }
        .btn-group { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
        .t-btn {
            background: rgba(18, 48, 86, 0.95);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.42);
            border-radius: 7px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }
        .t-btn:hover { background: #0284c7; border-color: #ffffff; }
        .t-btn.danger { background: rgba(153, 27, 27, 0.85); border-color: #f87171; }
        .t-btn.commit {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            border: 1.5px solid #a7f3d0;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 900;
            box-shadow: 0 0 14px rgba(16, 185, 129, 0.45);
        }
        .canvas-wrap {
            width: 100%;
            max-width: 1080px;
            margin: 0 auto;
            aspect-ratio: 960 / 500;
            border-radius: 10px;
            border: 2px solid #38bdf8;
            background: #1e293b;
            overflow: visible;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            cursor: grab;
        }
        canvas:active { cursor: grabbing; }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 7px;
            font-size: 12px;
            color: #bae6fd;
        }
        .badge-saved {
            color: #34d399;
            font-weight: 800;
            background: rgba(16,185,129,0.15);
            padding: 3px 10px;
            border-radius: 99px;
            border: 1px solid rgba(52,211,153,0.4);
        }
    </style>
    </head>

        </div>
    </div>

            const radius = Math.max(0, Math.min(r || 0, w / 2, h / 2));
            this.moveTo(x + radius, y);
            this.arcTo(x + w, y, x + w, y + h, radius);
            this.arcTo(x + w, y + h, x, y + h, radius);
            this.arcTo(x, y + h, x, y, radius);
            this.arcTo(x, y, x + w, y, radius);
            this.closePath();
            return this;
        };

    const canvas = document.getElementById("asphaltCanvas");
    const ctx = canvas.getContext("2d");
    const scenSel = document.getElementById("scenarioSelect");

    let currentRoad = "cross_4way";
    let items = [];
    let selectedIdx = -1;
    let dragMode = null;
    let dragOffset = {x:0, y:0};
    let autoSaveTimer = null;
    SCENARIOS.forEach((s, idx) => {
        const opt = document.createElement("option");
        opt.value = idx; opt.textContent = s.name;
        scenSel.appendChild(opt);
    });
    Object.entries(ROADS).forEach(([k, v]) => {
        const opt = document.createElement("option");
        opt.value = k; opt.textContent = v;
        roadSel.appendChild(opt);
    });
    function persistEditor() {
        try {
            window.parent.localStorage.setItem("bayyinah_asphalt_editor", JSON.stringify({
                scenarioIndex: Number(scenSel.value || 0),
                road: currentRoad,
                roadName: roadNameIn.value,
                items: items
            }));
        } catch (err) {}
    }
    function defaultCompass() {
        return { type: "compass", x: 895, y: 55, angle: 0 };
    }
    function keptCompass(source) {
        const found = (source || []).find(it => it && it.type === "compass");
        if (!found) return defaultCompass();
        return { type: "compass", x: Number(found.x) || 895, y: Number(found.y) || 55, angle: Number(found.angle) || 0 };
    }
    function ensureCompass() {
        if (!items.some(it => it && it.type === "compass")) items.push(defaultCompass());
    }
    function loadScenario(idx, quiet) {
        const compass = keptCompass(items);
        const sc = SCENARIOS[idx] || SCENARIOS[0];
        currentRoad = sc.road;
        roadSel.value = currentRoad;
        items = JSON.parse(JSON.stringify(sc.items)).filter(it => it.type !== "compass");
        items.push(compass);
        selectedIdx = -1;
        renderAll(false);
        if (!quiet) markDirty();
    }
    scenSel.addEventListener("change", () => loadScenario(Number(scenSel.value)));
    roadSel.addEventListener("change", () => { currentRoad = roadSel.value; renderAll(false); scheduleAutoCommit(); });
    roadNameIn.addEventListener("input", () => { renderAll(false); scheduleAutoCommit(); });

        ctx.beginPath(); ctx.arc(0, -13, 6, 0, Math.PI * 2);
        ctx.fillStyle = state === "red" ? "#ff1e1e" : "#451a1a";
        ctx.fill();
        if (state === "red") {
            ctx.strokeStyle = "#fecaca"; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2);
        ctx.fillStyle = state === "yellow" ? "#facc15" : "#423613";
        ctx.fill();
        if (state === "yellow") {
            ctx.strokeStyle = "#fef08a"; ctx.lineWidth = 2; ctx.stroke();
        }
        ctx.beginPath(); ctx.arc(0, 13, 6, 0, Math.PI * 2);
        ctx.fillStyle = state === "green" ? "#22c55e" : "#123824";
        ctx.fill();
        if (state === "green") {
            ctx.strokeStyle = "#bbf7d0"; ctx.lineWidth = 2; ctx.stroke();
        }
        if (isSelected && !hideHandles) {
            ctx.setLineDash([]);
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -24); ctx.lineTo(0, -40); ctx.stroke();
            ctx.fillStyle = "#38bdf8";
            ctx.strokeStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(0, -44, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.rotate(-((it.angle || 0) * Math.PI) / 180);
        const labelMap = { red: "إشارة حمراء", green: "إشارة خضراء", yellow: "إشارة صفراء" };
        const badgeCol = state === "red" ? "#dc2626" : (state === "green" ? "#16a34a" : "#ca8a04");
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = badgeCol;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.roundRect(-28, 36, 56, 16, 4); ctx.fill(); ctx.stroke();
        ctx.fillStyle = badgeCol;
        ctx.font = "bold 9.5px Tahoma, Arial";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(labelMap[state] || "إشارة", 0, 44);
        if (isSelected && !hideHandles) {
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]);
            ctx.strokeRect(-18, -30, 36, 62);
        }
        ctx.restore();
    }
    function drawCompassItem(it, isSelected, hideHandles) {
        ctx.save();
        ctx.translate(it.x, it.y);
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.beginPath(); ctx.arc(2, 3, 29, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
        ctx.strokeStyle = isSelected && !hideHandles ? "#38bdf8" : "#0f172a";
        ctx.lineWidth = isSelected && !hideHandles ? 2.8 : 2;
        ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        const rad = ((it.angle || 0) * Math.PI) / 180;
        ctx.save();
        ctx.rotate(rad);
        ctx.fillStyle = "#dc2626";
        ctx.beginPath();
        ctx.moveTo(0, -22);
        ctx.lineTo(-7, 2);
        ctx.lineTo(0, -3);
        ctx.lineTo(7, 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#64748b";
        ctx.beginPath();
        ctx.moveTo(0, 18);
        ctx.lineTo(-5, 2);
        ctx.lineTo(0, -1);
        ctx.lineTo(5, 2);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#0f172a";
        ctx.font = "900 10px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("شمال", 0, 11);
        ctx.fillText("N", 0, -26);
        if (isSelected && !hideHandles) {
            ctx.strokeStyle = "#38bdf8";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, -29); ctx.lineTo(0, -44); ctx.stroke();
            ctx.fillStyle = "#38bdf8";
            ctx.strokeStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(0, -46, 6.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        }
        ctx.restore();
        ctx.restore();
    }
    function drawHudOverlay() {
        ctx.save();
        ctx.fillStyle = "rgba(255, 255, 255, 0.96)";
        ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 1.8;
        ctx.beginPath(); ctx.roundRect(14, 446, 932, 42, 6); ctx.fill(); ctx.stroke();
        const rName = roadNameIn.value.trim() || ROADS[currentRoad].replace(/^\d+\.\s*/, "");
        ctx.font = "bold 12.5px Tahoma, Arial";
        ctx.fillStyle = "#0f172a";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillText("الموقع: " + rName, 932, 472, 380);
        ctx.font = "bold 12px Tahoma, Arial";
        ctx.textAlign = "center";
        ctx.fillStyle = "#dc2626";
        ctx.fillText("🔴 (1) الطرف الأول ومساره", 470, 467);
        ctx.fillStyle = "#2563eb";
        ctx.fillText("🔵 (2) الطرف الثاني ومساره", 285, 467);
        ctx.fillStyle = "#b91c1c";
        ctx.fillText("✖ نقطة الاصطدام", 115, 467);
        ctx.restore();
    }
    function renderAll(hideSelectionHandles) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawAsphaltRoad(currentRoad);
        items.forEach(it => {
            if (it.tailX !== undefined && it.tailY !== undefined) {
                drawArrowLine(it.tailX, it.tailY, it.x, it.y, it.color || "#ef4444", Boolean(it.skid));
            }
        });
        items.forEach((it, idx) => {
            if (it.type === "impact" || it.type === "compass" || it.type === "traffic_light") return;
            if (["car","truck","bike"].includes(it.type)) drawVehicleShape(it, idx === selectedIdx, hideSelectionHandles);
            else drawSpecialItem(it, idx === selectedIdx, hideSelectionHandles);
        });
        items.forEach((it, idx) => {
            if (it.type === "impact") drawSpecialItem(it, idx === selectedIdx, hideSelectionHandles);
        });
        items.forEach((it, idx) => {
            if (it.type === "traffic_light") drawTrafficLightItem(it, idx === selectedIdx, hideSelectionHandles);
        });
        items.forEach((it, idx) => {
            if (it.type === "compass") drawCompassItem(it, idx === selectedIdx, hideSelectionHandles);
        });
        drawHudOverlay();
    }
    function getCanvasPos(evt) {
        const r = canvas.getBoundingClientRect();
        return {
            x: (evt.clientX - r.left) * (canvas.width / r.width),
            y: (evt.clientY - r.top) * (canvas.height / r.height)
        };
    }
    function isVectorShape(type) {
        return ["pedestrian","animal","camel","livestock","obstacle","barrier","pole"].includes(type);
    }
    function canRotateItem(type) {
        return ["car","truck","bike","compass","traffic_light"].includes(type) || isVectorShape(type);
    }
    canvas.addEventListener("mousedown", e => {
        const p = getCanvasPos(e);
        if (selectedIdx >= 0 && canRotateItem(items[selectedIdx].type)) {
            const sel = items[selectedIdx];
            const rad = (sel.angle || 0) * Math.PI / 180;
            let hx;
            let hy;
            if (sel.type === "compass" || sel.type === "traffic_light") {
                const handleReach = sel.type === "compass" ? 46 : 44;
                hx = sel.x + Math.sin(rad) * handleReach;
                hy = sel.y - Math.cos(rad) * handleReach;
            } else if (isVectorShape(sel.type)) {
                hx = sel.x + Math.cos(rad) * 44;
                hy = sel.y + Math.sin(rad) * 44;
            } else {
                const w = sel.type === "truck" ? 104 : (sel.type === "bike" ? 44 : 68);
                hx = sel.x + Math.cos(rad) * (w/2 + 26);
                hy = sel.y + Math.sin(rad) * (w/2 + 26);
            }
            if (Math.hypot(p.x - hx, p.y - hy) <= 15) {
                dragMode = "rotate";
                return;
            }
        }
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            if (it.tailX !== undefined && Math.hypot(p.x - it.tailX, p.y - it.tailY) <= 14) {
                selectedIdx = i; dragMode = "tail"; renderAll(false); return;
            }
        }
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            const hitR = it.type === "truck" ? 46 : (it.type === "compass" ? 34 : (it.type === "traffic_light" ? 42 : (isVectorShape(it.type) ? 36 : 32)));
            if (Math.hypot(p.x - it.x, p.y - it.y) <= hitR) {
                selectedIdx = i;
                dragMode = "body";
                dragOffset = { x: p.x - it.x, y: p.y - it.y };
                renderAll(false);
                return;
            }
        }
        selectedIdx = -1;
        renderAll(false);
    });
    window.addEventListener("mousemove", e => {
        if (!dragMode || selectedIdx < 0) return;
        const p = getCanvasPos(e);
        const it = items[selectedIdx];
        if (dragMode === "body") {
            it.x = Math.max(25, Math.min(935, p.x - dragOffset.x));
            it.y = Math.max(25, Math.min(435, p.y - dragOffset.y));
        } else if (dragMode === "tail") {
            it.tailX = Math.max(15, Math.min(945, p.x));
            it.tailY = Math.max(15, Math.min(440, p.y));
        } else if (dragMode === "rotate") {
            const pointer = Math.atan2(p.y - it.y, p.x - it.x) * 180 / Math.PI;
            const upright = it.type === "compass" || it.type === "traffic_light";
            it.angle = Math.round(upright ? pointer + 90 : pointer);
        }
        renderAll(false);
    });
    window.addEventListener("mouseup", () => {
        if (dragMode) {
            dragMode = null;
            scheduleAutoCommit();
        }
    });
    canvas.addEventListener("wheel", e => {
        const p = getCanvasPos(e);
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            const reach = it.type === "compass" ? 52 : (it.type === "traffic_light" ? 48 : 42);
            if (canRotateItem(it.type) && Math.hypot(p.x - it.x, p.y - it.y) <= reach) {
                e.preventDefault();
                selectedIdx = i;
                it.angle = ((it.angle || 0) + (e.deltaY > 0 ? 8 : -8)) % 360;
                renderAll(false);
                scheduleAutoCommit();
                return;
            }
        }
    }, { passive: false });
    window.rotateSelected = function(delta) {
        if (selectedIdx >= 0 && canRotateItem(items[selectedIdx].type)) {
            items[selectedIdx].angle = ((items[selectedIdx].angle || 0) + delta) % 360;
            renderAll(false);
            scheduleAutoCommit();
        }
    };
    window.resetCompass = function() {
        let compass = items.find(it => it.type === "compass");
        if (!compass) {
            compass = defaultCompass();
            items.push(compass);
        } else {
            compass.x = 895;
            compass.y = 55;
            compass.angle = 0;
        }
        selectedIdx = items.indexOf(compass);
        renderAll(false);
        scheduleAutoCommit();
    };
    window.deleteSelected = function() {
        if (selectedIdx >= 0 && items[selectedIdx].type === "compass") {
            document.getElementById("saveStatus").textContent = "البوصلة تبقى على اللوحة؛ يمكن سحبها أو تدويرها أو إعادة ضبطها";
            return;
        }
        if (selectedIdx >= 0) {
            items.splice(selectedIdx, 1);
            selectedIdx = -1;
            renderAll(false);
            scheduleAutoCommit();
        }
    };
    window.addExtraItem = function(kind) {
        if (kind === "sedan3") items.push({type:"car", label:"3", color:"#10b981", x:480, y:250, angle:0, tailX:340, tailY:250});
        else if (kind === "truck") items.push({type:"truck", label:"شاحنة", color:"#f59e0b", x:480, y:250, angle:0, tailX:310, tailY:250});
        else if (kind === "bike") items.push({type:"bike", label:"دراجة", color:"#06b6d4", x:480, y:250, angle:0, tailX:360, tailY:250});
        else if (kind === "pedestrian") items.push({type:"pedestrian", x:480, y:220, angle:0, tailX:480, tailY:130});
        else if (kind === "animal") items.push({type:"animal", x:500, y:220, angle:0, tailX:500, tailY:120});
        else if (kind === "livestock") items.push({type:"livestock", x:540, y:250, angle:0});
        else if (kind === "obstacle") items.push({type:"obstacle", x:520, y:200, angle:0});
        else if (kind === "pole") items.push({type:"pole", x:600, y:160, angle:0});
        else if (kind === "signal") items.push({type:"traffic_light", x:480, y:150, angle:0, state:"red"});
        else if (kind === "skid" && selectedIdx >= 0) items[selectedIdx].skid = !items[selectedIdx].skid;
        selectedIdx = items.length - 1;
        renderAll(false);
        scheduleAutoCommit();
    };
    window.cycleSignalColor = function() {
        let idx = (selectedIdx >= 0 && items[selectedIdx].type === "traffic_light")
            ? selectedIdx
            : items.findIndex(it => it.type === "traffic_light");
        if (idx < 0) {
            addExtraItem("signal");
            return;
        }
        items[idx].state = nextSignalState(items[idx].state);
        selectedIdx = idx;
        renderAll(false);
        scheduleAutoCommit();
    };
    canvas.addEventListener("dblclick", e => {
        const p = getCanvasPos(e);
        for (let i = items.length - 1; i >= 0; i--) {
            const it = items[i];
            if (it.type === "traffic_light" && Math.hypot(p.x - it.x, p.y - it.y) <= 42) {
                it.state = nextSignalState(it.state);
                selectedIdx = i;
                renderAll(false);
                scheduleAutoCommit();
                return;
            }
        }
    });
    function scheduleAutoCommit() {
        markDirty();
    }
    function sendToStreamlit(type, extra) {
        window.parent.postMessage(
            Object.assign({ isStreamlitMessage: true, type: type }, extra || {}),
            "*"
        );
    }
    let componentInitialized = false;
    window.addEventListener("message", function(event) {
        if (!event.data || event.data.type !== "streamlit:render") return;
        const args = event.data.args || {};
        if (!componentInitialized) {
            componentInitialized = true;
            if (args.saved_state && Array.isArray(args.saved_state.items) && args.saved_state.items.length > 0) {
                currentRoad = args.saved_state.road || "cross_4way";
                roadSel.value = currentRoad;
                roadNameIn.value = args.saved_state.roadName || args.default_loc || "";
                items = JSON.parse(JSON.stringify(args.saved_state.items));
                ensureCompass();
                selectedIdx = -1;
                renderAll(false);
            } else {
                if (args.default_loc && !roadNameIn.value) {
                    roadNameIn.value = args.default_loc;
                }
                loadScenario(0, true);
            }
            syncFrameHeight();
        }
    });
    function markDirty() {
        const stEl = document.getElementById("saveStatus");
        if (stEl) {
            stEl.textContent = "⚠️ تعديلات غير معتمدة — اضغط «اعتماد الكروكي في التقرير»";
            stEl.style.color = "#fbbf24";
        }
    }
    window.commitToStreamlit = function() {
        renderAll(true);
        const pngDataUrl = canvas.toDataURL("image/png", 1.0);
        renderAll(false);
        const stEl = document.getElementById("saveStatus");
        if (stEl) {
            stEl.textContent = "✅ تم اعتماد وإرسال الكروكي إلى صفحة التقرير A4";
            stEl.style.color = "#34d399";
        }
        sendToStreamlit("streamlit:setComponentValue", {
            value: {
                image: pngDataUrl,
                state: {
                    road: currentRoad,
                    roadName: roadNameIn.value || "",
                    items: items
                },
                ts: Date.now()
            }
        });
    };
    function syncFrameHeight() {
        const shell = document.querySelector(".studio-shell");
        if (!shell) return;
        const fullHeight = Math.ceil(shell.getBoundingClientRect().height) + 24;
        sendToStreamlit("streamlit:setFrameHeight", { height: fullHeight });
    }
    if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => syncFrameHeight());
        ro.observe(document.body);
    }
    window.addEventListener("load", () => setTimeout(syncFrameHeight, 80));
    window.addEventListener("resize", syncFrameHeight);
    setTimeout(syncFrameHeight, 250);
    sendToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    syncFrameHeight();
    </script>
    </body>
